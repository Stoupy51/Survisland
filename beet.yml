
# Identity
id: "survisland"
name: "Survisland"
author: "Stoupy51"
version: "2.7.0"
minecraft: "26.2"

# Some directories
directory: "."
output: "build"

# A list of importable plugin strings
require:
    - "stewbeet"

# Takes a nested pack config, see PackConfig() documentation
data_pack:
    name: "datapack"
    load: ["merge/datapack"]

# Takes a nested pack config, see PackConfig() documentation
resource_pack:
    name: resource_pack
    load: ["merge/resource_pack"]

# A list of strings or dicts representing "plugins".
# - These plugins will execute after the pack is loaded
# - If item = str, should be a path to an importable plugin (ex: "stewbeet.plugins.auto_lang")
# - If item = dict, should be a nestable project config
#     - Each sub-pipeline creates a temp context inheriting the parent context
pipeline:
    - "user.setup_definitions" # User code
    - "stewbeet.plugins.resource_pack.sounds.silent"
    - "stewbeet.plugins.resource_pack.item_models.silent"
    # - "stewbeet.plugins.resource_pack.check_power_of_2"
    - "stewbeet.plugins.custom_recipes.silent"
    - "stewbeet.plugins.custom_paintings.silent"
    # - "stewbeet.plugins.ingame_manual"
    - "stewbeet.plugins.datapack.loading.silent"
    - "stewbeet.plugins.datapack.custom_blocks.silent"
    - "stewbeet.plugins.datapack.loot_tables.silent"
    - "stewbeet.plugins.datapack.sorters.silent"
    - "stewbeet.plugins.compatibilities.simpledrawer.silent"
    - "stewbeet.plugins.compatibilities.neo_enchant.silent"
    - "user.link" # User code
    - "stewbeet.plugins.finalyze.custom_blocks_ticking.silent"
    - "stewbeet.plugins.finalyze.basic_datapack_structure.silent"
    - "stewbeet.plugins.finalyze.dependencies"
    # - "stewbeet.plugins.finalyze.check_unused_textures"
    - "stewbeet.plugins.finalyze.last_final.silent"
    - "stewbeet.plugins.auto.scoreboard_constants.silent"
    # - "stewbeet.plugins.auto.lang_file"
    - "stewbeet.plugins.auto.headers.silent"
    - "stewbeet.plugins.archive"
    - "stewbeet.plugins.merge_smithed_weld.datapack"
    - "stewbeet.plugins.merge_smithed_weld.resource_pack"
    - "stewbeet.plugins.copy_to_destination.silent"
    - "stewbeet.plugins.compute_sha1.silent"

# Generic dict which holds extra information usable by plugins
meta:
    # Survisland specific data to disable/enable features
    survisland:
        modules:
            aube_ecarlate: {"sounds": False, "items": False}
            abyssion_wrath: {"sounds": True, "items": True}
            lefortdesrats: {"sounds": True, "items": True}

    # Model resolver configuration for caching models
    model_resolver:
        use_cache: true

    # StewBeet specific configuration
    stewbeet:
        # Directory containing all project textures
        textures_folder: "assets/textures"
        # Directory containing all custom sounds
        sounds:
            folder: "assets/sounds"
            # Optional: glob patterns to exclude from processing
            exclude_patterns: []
        # Directory containing all jukebox records
        records_folder: "assets/records"
        # Directory containing libraries that will be copied to the build destination, and merged using Smithed Weld if enabled.
        libs_folder: "libs"
        # Path where definitions debug information will be dumped
        definitions_debug: "definitions_debug.json"
        # Optional list of destination paths where generated files will be copied
        build_copy_destinations:
            # Paths to copy the datapack(s) to
            datapack: ["./datapack_shortcut"]   # cmd /c mklink /d "datapack_shortcut" "D:\latest_snapshot\world\datapacks"
            # Paths to copy the resource pack(s) to
            resource_pack: ["./resource_pack_shortcut"]   # cmd /c mklink /d "resource_pack_shortcut" "D:\minecraft\snapshot\resourcepacks"

        # Automagically checks for dependencies and their minimum required versions at runtime.
        load_dependencies: {
            "golf_ball": {"name":"GolfBall", "url":"https://github.com/Stoupy51/GolfBall","source":"modrinth", "modrinth_slug":"golf_ball"},
            "shopping_kart": {"name":"ShoppingKart", "url":"https://github.com/Stoupy51/ShoppingKart","source":"modrinth", "modrinth_slug":"shopping_kart", "has_resource_pack": True},
        }

        # Configuration for in-game manual
        manual:
            high_resolution: true
            cache_path: "manual_cache"
            cache_assets: true
            cache_pages: false
            json_dump_path: "manual_cache/content.json"
            first_page_text: [{"text":"Ratio gold", "color":"#505050"}]
            showcase_image: 3
            use_dialog: 1 # 0 = no, 1 = yes, 2 = yes and no book

