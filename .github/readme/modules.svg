<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-label="Un module regroupe du contenu qu'une ligne de beet.yml ajoute au pack ou en retire.">
	<style>
		text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
		.title { font-size: 16px; font-weight: 600; }
		.caption { font-size: 12px; fill: #59636e; }
		.mono { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 12.5px; }
		.card { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
		.box { fill: #ffffff; stroke: #d1d9e0; }
		.chevron { fill: none; stroke: #8c959f; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
		.group { fill: none; stroke: #2da44e; stroke-width: 2; stroke-dasharray: 5 4; }
		.knob { fill: #ffffff; animation: knob 8s infinite; }
		.track { animation: track 8s infinite; }
		.on { animation: on 8s infinite; }
		.off { animation: off 8s infinite; }
		.pop { transform-box: fill-box; transform-origin: center; animation: pop 8s infinite; }
		@keyframes knob { 0%, 48% { transform: translateX(26px); } 52%, 96% { transform: translateX(0); } 100% { transform: translateX(26px); } }
		@keyframes track { 0%, 48% { fill: #2da44e; } 52%, 96% { fill: #8c959f; } 100% { fill: #2da44e; } }
		@keyframes on { 0%, 48% { opacity: 1; } 52%, 96% { opacity: 0; } 100% { opacity: 1; } }
		@keyframes off { 0%, 48% { opacity: 0; } 52%, 96% { opacity: 1; } 100% { opacity: 0; } }
		@keyframes pop { 0%, 50% { opacity: 1; transform: scale(1); } 56%, 96% { opacity: 0; transform: scale(0.6); } 100% { opacity: 1; transform: scale(1); } }
		@media (prefers-color-scheme: dark) {
			text { fill: #f0f6fc; }
			.caption { fill: #9198a1; }
			.card { fill: #151b23; stroke: #3d444d; }
			.box { fill: #0d1117; stroke: #3d444d; }
			.group { stroke: #3fb950; }
		}
	</style>
	<path class="chevron" d="M296 103 l9 12 l-9 12"/>
	<path class="chevron" d="M596 103 l9 12 l-9 12"/>
	<g transform="translate(15 15)">
		<rect class="card" width="270" height="200" rx="12"/>
		<text class="title" x="135" y="34" text-anchor="middle">1. Un module</text>
		<rect class="box" x="51" y="56" width="168" height="34" rx="6"/>
		<text class="mono" x="135" y="78" text-anchor="middle">mon_module.py</text>
		<image x="71" y="106" width="32" height="32" style="image-rendering: pixelated" href="data:image/png;base64,"/><image x="119" y="106" width="32" height="32" style="image-rendering: pixelated" href="data:image/png;base64,"/><image x="167" y="106" width="32" height="32" style="image-rendering: pixelated" href="data:image/png;base64,"/>
		<text class="caption" x="135" y="178" text-anchor="middle">Le contenu d'un mode de jeu, regroupé</text>
	</g>
	<g transform="translate(315 15)">
		<rect class="card" width="270" height="200" rx="12"/>
		<text class="title" x="135" y="34" text-anchor="middle">2. Son interrupteur</text>
		<rect class="box" x="27" y="56" width="216" height="34" rx="6"/>
		<text class="mono on" x="135" y="78" text-anchor="middle">mon_module: {"items": True}</text>
		<text class="mono off" x="135" y="78" text-anchor="middle">mon_module: {"items": False}</text>
		<rect class="track" x="107" y="106" width="56" height="30" rx="15"/>
		<circle class="knob" cx="122" cy="121" r="11"/>
		<text class="caption" x="135" y="178" text-anchor="middle">Une ligne dans beet.yml</text>
	</g>
	<g transform="translate(615 15)">
		<rect class="card" width="270" height="200" rx="12"/>
		<text class="title" x="135" y="34" text-anchor="middle">3. Le pack</text>
		<rect class="box" x="19" y="84" width="40" height="40" rx="4" stroke-width="2"/><image x="23" y="88" width="32" height="32" style="image-rendering: pixelated" href="data:image/png;base64,"/><rect class="box" x="67" y="84" width="40" height="40" rx="4" stroke-width="2"/><image x="71" y="88" width="32" height="32" style="image-rendering: pixelated" href="data:image/png;base64,"/>
		<g class="pop">
			<rect class="group" x="109" y="78" width="148" height="52" rx="8"/>
			<rect class="box" x="115" y="84" width="40" height="40" rx="4" stroke-width="2"/><image x="119" y="88" width="32" height="32" style="image-rendering: pixelated" href="data:image/png;base64,"/><rect class="box" x="163" y="84" width="40" height="40" rx="4" stroke-width="2"/><image x="167" y="88" width="32" height="32" style="image-rendering: pixelated" href="data:image/png;base64,"/><rect class="box" x="211" y="84" width="40" height="40" rx="4" stroke-width="2"/><image x="215" y="88" width="32" height="32" style="image-rendering: pixelated" href="data:image/png;base64,"/>
		</g>
		<text class="caption on" x="135" y="178" text-anchor="middle">Les items du module sont en jeu</text>
		<text class="caption off" x="135" y="178" text-anchor="middle">Les items du module ont disparu</text>
	</g>
</svg>
