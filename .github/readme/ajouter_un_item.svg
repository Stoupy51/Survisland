<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 230" role="img" aria-label="Ajouter un item : une texture, une ligne de Python, un build, et l'item existe en jeu.">
	<style>
		text { font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
		.title { font-size: 16px; font-weight: 600; }
		.caption { font-size: 12px; fill: #59636e; }
		.mono { font-family: ui-monospace, Consolas, "Courier New", monospace; font-size: 12.5px; }
		.card { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; animation: focus 10s infinite; }
		.box { fill: #ffffff; stroke: #d1d9e0; }
		.chevron { fill: none; stroke: #8c959f; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
		.s2 { animation-delay: 2.5s; } .s3 { animation-delay: 5s; } .s4 { animation-delay: 7.5s; }
		@keyframes focus { 0%, 22% { stroke: #2da44e; stroke-width: 3.5; } 27%, 100% { stroke: #d1d9e0; stroke-width: 1.5; } }
		@media (prefers-color-scheme: dark) {
			text { fill: #f0f6fc; }
			.caption { fill: #9198a1; }
			.card { fill: #151b23; stroke: #3d444d; }
			.box { fill: #0d1117; stroke: #3d444d; }
			@keyframes focus { 0%, 22% { stroke: #3fb950; stroke-width: 3.5; } 27%, 100% { stroke: #3d444d; stroke-width: 1.5; } }
		}
		.cursor { animation: blink 1s steps(2) infinite; }
		.pop { transform-box: fill-box; transform-origin: center; animation: pop 10s infinite; }
		@keyframes blink { 50% { opacity: 0; } }
		@keyframes pop { 0%, 72% { transform: scale(0); } 78% { transform: scale(1.25); } 82%, 100% { transform: scale(1); } }
	</style>
	<path class="chevron" d="M221 103 l9 12 l-9 12"/>
	<path class="chevron" d="M446 103 l9 12 l-9 12"/>
	<path class="chevron" d="M671 103 l9 12 l-9 12"/>
	<g transform="translate(15 15)">
		<rect class="card s1" width="195" height="200" rx="12"/>
		<text class="title" x="97.5" y="34" text-anchor="middle">1. Une texture</text>
		<image x="57.5" y="64" width="80" height="80" style="image-rendering: pixelated" href="data:image/png;base64,"/>
		<text class="caption" x="97.5" y="178" text-anchor="middle">assets/textures/croissant.png</text>
	</g>
	<g transform="translate(240 15)">
		<rect class="card s2" width="195" height="200" rx="12"/>
		<text class="title" x="97.5" y="34" text-anchor="middle">2. Une ligne de Python</text>
		<rect class="box" x="14" y="84" width="167" height="40" rx="6"/>
		<text class="mono" x="97.5" y="109" text-anchor="middle">Item(id="croissant")</text>
		<text class="caption" x="97.5" y="178" text-anchor="middle">user/database/food.py</text>
	</g>
	<g transform="translate(465 15)">
		<rect class="card s3" width="195" height="200" rx="12"/>
		<text class="title" x="97.5" y="34" text-anchor="middle">3. Le build</text>
		<rect class="box" x="14" y="84" width="167" height="40" rx="6"/>
		<text class="mono" x="28" y="109">&gt; uv run stewbeet<tspan class="cursor">_</tspan></text>
		<text class="caption" x="97.5" y="178" text-anchor="middle">datapack + resource pack</text>
	</g>
	<g transform="translate(690 15)">
		<rect class="card s4" width="195" height="200" rx="12"/>
		<text class="title" x="97.5" y="34" text-anchor="middle">4. En jeu</text>
		<rect class="box" x="57.5" y="64" width="80" height="80" rx="4" stroke-width="3"/>
		<image class="pop" x="65.5" y="72" width="64" height="64" style="image-rendering: pixelated" href="data:image/png;base64,"/>
		<text class="caption" x="97.5" y="178" text-anchor="middle">L'item existe dans Minecraft</text>
	</g>
</svg>
